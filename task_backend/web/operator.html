<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的采集任务 · Orbbec</title>
  <style>
    :root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#18353b;background:#f2f6f5;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dce7e3;padding:20px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-size:18px;letter-spacing:2px;font-weight:750;color:#087c72}.small{font-size:13px;color:#59736f;line-height:1.7}
    main{max-width:1160px;margin:auto;padding:40px 20px}h1{font-size:30px;line-height:1.3;margin:12px 0;overflow-wrap:anywhere}h2{font-size:18px;margin:0 0 18px}p{line-height:1.8}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#087c72}
    .card{border:1px solid #dce7e3;border-radius:16px;background:white;padding:28px}.login{max-width:440px;margin:7vh auto}.login p{color:#59736f}
    label{display:block;margin:20px 0 8px;font-size:14px;font-weight:650}input{width:100%;padding:13px 14px;font:inherit;border:1px solid #becfc9;border-radius:8px}input:focus{outline:2px solid #087c72;outline-offset:2px}
    button{cursor:pointer;font:inherit;border:1px solid #cbdad5;border-radius:8px;background:white;padding:11px 16px;color:#18353b;white-space:nowrap}button:focus-visible{outline:3px solid #55b3a6;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.primary{background:#087c72;color:white;border-color:#087c72}.login button{width:100%;margin-top:24px}
    .account{display:flex;align-items:center;gap:14px;min-width:0}.account span{overflow-wrap:anywhere}.notice{padding:14px 18px;margin:0 0 20px;border-radius:10px;background:#fff3df;color:#7c4e12;line-height:1.6}.error{background:#fff0ef;color:#963d32}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.badge{display:inline-block;color:#087c72;background:#e3f1ed;border-radius:6px;padding:6px 10px;font-size:13px}.progress{flex-shrink:0;text-align:right}.progress strong{font-size:26px}.progress p{margin:6px 0 0}
    .layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px}.video-card{padding:0;overflow:hidden;align-self:start}.video-title{padding:20px 24px;border-bottom:1px solid #dce7e3}video{display:block;width:100%;max-height:65vh;background:#102c31;aspect-ratio:16/9}.instructions{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:16px}.placeholder{padding:42px 24px;text-align:center;color:#59736f;line-height:1.8}.empty{text-align:center;padding:60px 24px}.empty h2{font-size:24px}.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:24px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#087c72;margin-right:7px}
    [hidden]{display:none!important}@media(max-width:720px){main{padding-top:28px}.layout{grid-template-columns:1fr}.card{padding:22px}.video-card{padding:0}.intro{align-items:start;flex-direction:column;gap:14px}.progress{text-align:left}.progress p{display:inline;margin-left:10px}h1{font-size:26px}.foot{align-items:start}.login{margin:3vh auto}.account{font-size:13px;gap:8px}header{padding:16px}.account button{padding:8px 10px}}
  </style>
</head>
<body>
  <header><div class="brand">ORBBEC</div><div id="account" class="account" hidden><span id="username"></span><button id="logout">退出登录</button></div></header>
  <main>
    <div id="error" class="notice error" role="alert" hidden></div>
    <section id="login" class="card login">
      <span class="eyebrow">采集工作台</span><h1>查看我的任务</h1><p>使用采集端的操作员账号登录，查看后端为你分配的任务。</p>
      <form id="loginForm"><label for="name">操作员账号</label><input id="name" name="username" autocomplete="username" required>
        <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" class="primary" type="submit">登录并查看任务</button></form>
    </section>
    <section id="workspace" hidden>
      <div id="waiting" class="card empty" hidden><span class="eyebrow">任务分配</span><h2>暂无可分配的任务</h2><p class="small">你已完成当前任务，或其余任务已分配给其他操作员。<br>有新任务时会自动显示，无需重复登录。</p></div>
      <div id="task" hidden>
        <div class="intro"><div><span class="badge">后端已分配 · 当前任务</span><h1 id="taskName"></h1><div class="small">此任务的全部采集次数由你完成，完成后自动切换下一任务。</div></div><div class="progress"><strong id="progress"></strong><p class="small">已确认的采集次数</p></div></div>
        <div class="layout"><section class="card video-card"><div class="video-title"><h2 style="margin:0">演示视频</h2></div><video id="video" controls playsinline preload="metadata" loop hidden></video><div id="noVideo" class="placeholder">该任务暂未提供演示视频，请参考右侧任务说明。</div></section>
          <section class="card"><h2>任务说明</h2><div id="description" class="instructions"></div></section></div>
      </div>
      <div class="foot"><span id="status" class="small" role="status" aria-live="polite"></span><button id="refresh">刷新任务</button></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let active=false,busy=false,epoch=0,mediaKey='';
    async function api(path,data){const response=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,cache:'no-store',credentials:'same-origin'});const body=await response.json();if(!response.ok){const error=new Error(body.error||'请求失败');error.status=response.status;throw error}return body}
    function error(message){$('error').textContent=message;$('error').hidden=!message}
    function reset(){active=false;epoch++;mediaKey='';$('video').pause();$('video').removeAttribute('src');$('video').load();$('workspace').hidden=true;$('account').hidden=true;$('login').hidden=false;$('password').value=''}
    async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;const version=epoch;
      try{const data=await api('/api/v1/operator/task');if(version!==epoch)return;active=true;error('');$('login').hidden=true;$('account').hidden=false;$('workspace').hidden=false;$('username').textContent=data.username;
        const task=data.task;$('waiting').hidden=!!task;$('task').hidden=!task;
        const key=task?task.task_name+'|'+(task.demo_url||''):'';
        if(key!==mediaKey){$('video').pause();if(task?.demo_url)$('video').src=task.demo_url;else $('video').removeAttribute('src');$('video').load();mediaKey=key}
        if(task){$('taskName').textContent=task.task_name;$('progress').textContent=task.completed+' / '+task.total;$('description').textContent=task.description_cn||task.description_en||'暂未提供任务说明，请联系管理员补充。';$('video').hidden=!task.demo_url;$('noVideo').hidden=!!task.demo_url}
        $('status').textContent='已同步 · '+new Date().toLocaleTimeString()+' · 每 3 秒自动更新';
      }catch(e){if(version!==epoch)return;if(e.status===401){reset();}else{error(e.status===503?'后端尚未启动采集实例，启动后会自动显示任务。':'任务同步失败：'+e.message+'，正在等待恢复。')}}finally{busy=false;$('refresh').disabled=false}}
    $('loginForm').onsubmit=async event=>{event.preventDefault();$('loginButton').disabled=true;error('');try{await api('/api/v1/operator/login',{username:$('name').value.trim(),password:$('password').value});epoch++;active=true;$('password').value='';await refresh()}catch(e){error(e.status===401?'账号或密码不正确，请重新输入。':e.message)}finally{$('loginButton').disabled=false}};
    $('logout').onclick=async()=>{try{await api('/api/v1/operator/logout',{});reset();error('')}catch(e){error('退出失败，请重试。')}};
    $('video').onerror=()=>{if($('video').getAttribute('src')){$('noVideo').hidden=false;$('noVideo').textContent='视频暂时无法播放，请检查任务资源或联系管理员。'}};
    $('refresh').onclick=refresh;document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active)refresh()});setInterval(()=>{if(active&&!document.hidden)refresh()},3000);refresh();
  </script>
</body>
</html>
